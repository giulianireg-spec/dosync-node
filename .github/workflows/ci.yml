name: DoSync Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  certify:
    name: Standard 32/32 — Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ "20", "22" ]

    steps:
      - name: Checkout dosync-node
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Checkout dosync-protocol (certify.py)
        uses: actions/checkout@v4
        with:
          repository: giulianireg-spec/dosync-protocol
          path: dosync-protocol

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm install
          pip install requests --quiet

      - name: Syntax check
        run: node --check src/server.js && echo "✓ syntax OK"

      - name: Standard certification (32/32)
        run: |
          DOSYNC_TOKEN=ci-test-token node src/server.js &
          SERVER_PID=$!
          sleep 2

          DOSYNC_TOKEN=ci-test-token \
          python3 dosync-protocol/certify.py \
            --host localhost \
            --port 47201 \
            --tier standard

          EXIT_CODE=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $EXIT_CODE
